name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-desktop.txt
      - run: python -m compileall -q app desktop.py
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --clean sitepulse.spec
      - name: Check packaged application startup
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Resolve-Path 'dist/SitePulse.exe') -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "SitePulse startup check failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: SitePulse-Windows
          path: dist/SitePulse.exe
