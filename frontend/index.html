<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SitePulse — Client monitoring</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>[x-cloak]{display:none!important}body{font-family:'DM Sans',ui-sans-serif,system-ui,sans-serif;background:#f4f4ef;color:#20282a}h1,h2,h3,.brand{font-family:'Space Grotesk',sans-serif}.modal-bg{background:rgba(15,23,42,.68);backdrop-filter:blur(5px)}.card-shadow{box-shadow:0 8px 28px rgba(30,40,32,.035)}.hero{background:radial-gradient(circle at 81% 25%,rgba(173,226,141,.17),transparent 31%),linear-gradient(115deg,#172a27,#213d37);position:relative;overflow:hidden}.hero:after{content:'';position:absolute;right:-55px;top:-120px;width:390px;height:390px;border:1px solid rgba(203,244,175,.15);border-radius:50%;box-shadow:0 0 0 42px rgba(203,244,175,.035),0 0 0 84px rgba(203,244,175,.03),0 0 0 126px rgba(203,244,175,.02);pointer-events:none}.eyebrow-dot{box-shadow:0 0 0 4px rgba(185,239,157,.13)}.bg-indigo-600{background-color:#b8ed98!important;color:#173028!important}.hover\:bg-indigo-700:hover{background-color:#a4df82!important}.text-indigo-600{color:#427b52!important}.bg-indigo-50{background-color:#edf7e9!important}.text-indigo-700{color:#31633f!important}.bg-indigo-100{background-color:#e4f4df!important} </style>
</head>
<body class="bg-slate-50 text-slate-900" x-data="dashboard()" x-init="init()" x-cloak :lang="lang">
  <header class="border-b border-slate-200 bg-white">
    <nav class="mx-auto flex max-w-7xl items-center justify-between px-5 py-5 sm:px-8" aria-label="Main navigation">
      <div class="flex items-center gap-3"><div class="grid h-10 w-10 place-items-center rounded-xl bg-indigo-600 text-white"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h4l3-7 4 14 3-7h6"/></svg></div><div><div class="brand text-lg font-bold tracking-tight">sitepulse<span class="text-indigo-600">.</span></div><div class="text-[10px] font-semibold uppercase tracking-[.15em] text-slate-400" x-text="t('workspace')"></div></div></div>
      <div class="flex items-center gap-3"><span class="hidden text-xs font-medium text-slate-400 sm:block" x-text="t('language')"></span><button type="button" @click="toggleLanguage()" class="rounded-lg border border-slate-200 px-3 py-2 text-xs font-bold text-slate-600 hover:bg-slate-50" :aria-label="t('switchLanguage')" x-text="lang === 'en' ? 'EN / TR' : 'TR / EN'"></button><div class="hidden h-9 w-9 items-center justify-center rounded-full bg-indigo-100 text-xs font-bold text-indigo-700 sm:flex">SP</div></div>
    </nav>
  </header>
  <main class="mx-auto max-w-7xl px-5 pb-16 pt-10 sm:px-8 sm:pt-14">
    <div class="hero rounded-[26px] px-6 py-8 text-white sm:px-9 sm:py-10"><div class="relative z-10 flex flex-col justify-between gap-7 sm:flex-row sm:items-end"><div><p class="mb-5 flex items-center gap-2 text-[11px] font-bold uppercase tracking-[.2em] text-emerald-200"><span class="eyebrow-dot h-2 w-2 rounded-full bg-lime-300"></span><span x-text="t('overview')"></span> / SITEPULSE</p><h1 class="max-w-xl text-3xl font-bold tracking-tight sm:text-4xl" x-text="t('title')"></h1><p class="mt-3 max-w-lg text-sm leading-6 text-emerald-100/70" x-text="t('subtitle')"></p></div><button @click="openAdd()" class="inline-flex shrink-0 items-center justify-center gap-2 rounded-xl bg-indigo-600 px-5 py-3 text-sm font-bold shadow-sm hover:bg-indigo-700"><span class="text-lg leading-none">+</span><span x-text="t('addSite')"></span></button></div></div>
    <div x-show="error" role="alert" class="mt-6 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700" x-text="error"></div>
    <section class="mt-9 grid gap-4 sm:grid-cols-3" :aria-label="t('overview')">
      <template x-for="metric in metrics()" :key="metric.label"><div class="card-shadow rounded-2xl border border-slate-200 bg-white p-5"><div class="flex items-center justify-between"><span class="text-sm font-medium text-slate-500" x-text="metric.label"></span><span class="grid h-9 w-9 place-items-center rounded-xl text-lg" :class="metric.color" x-text="metric.icon"></span></div><div class="mt-4 text-3xl font-bold tracking-tight" x-text="metric.value"></div><div class="mt-1 text-xs text-slate-400" x-text="metric.hint"></div></div></template>
    </section>
    <section class="mt-12"><div class="mb-5 flex items-center justify-between gap-4"><div><h2 class="text-lg font-bold" x-text="t('yourSites')"></h2><p class="mt-1 text-sm text-slate-500" x-text="t('sitesSubtitle')"></p></div><button @click="load()" :disabled="loading" class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-50 disabled:opacity-50" x-text="t('refresh')"></button></div>
      <div x-show="loading && !data.sites.length" class="py-12 text-center text-sm text-slate-500" x-text="t('loading')"></div>
      <div x-show="!loading && !data.sites.length" class="rounded-2xl border border-dashed border-slate-300 bg-white py-16 text-center"><div class="text-3xl">◌</div><h3 class="mt-3 font-semibold" x-text="t('emptyTitle')"></h3><p class="mt-1 text-sm text-slate-500" x-text="t('emptyText')"></p><button @click="openAdd()" class="mt-5 text-sm font-semibold text-indigo-600" x-text="t('addFirst')"></button></div>
      <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3"><template x-for="site in data.sites" :key="site.id"><article class="card-shadow rounded-2xl border border-slate-200 bg-white p-5"><div class="flex items-start justify-between gap-3"><div class="flex min-w-0 items-center gap-3"><div class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-indigo-50 text-sm font-bold text-indigo-600" x-text="site.client_name.slice(0,2).toUpperCase()"></div><div class="min-w-0"><h3 class="truncate font-bold" x-text="site.client_name"></h3><a :href="site.url" target="_blank" rel="noopener noreferrer" class="block truncate text-xs text-slate-400 hover:text-indigo-600" x-text="site.url"></a></div></div><span class="shrink-0 rounded-full px-2.5 py-1 text-[11px] font-semibold" :class="statusClass(site)" x-text="statusText(site)"></span></div><div class="my-5 grid grid-cols-2 gap-3 border-y border-slate-100 py-4"><div><p class="text-xs text-slate-400" x-text="t('statusCode')"></p><p class="mt-1 text-sm font-semibold" x-text="site.http_status ?? t('unknown')"></p></div><div><p class="text-xs text-slate-400" x-text="t('domainCountdown')"></p><p class="mt-1 text-sm font-semibold" x-text="countdown(site.domain_expires_at)"></p></div></div><div class="flex items-center justify-between gap-2"><span class="text-xs text-slate-400" x-text="site.response_ms == null ? t('noResponse') : site.response_ms + ' ms'"></span><button @click="showSite(site.id)" class="text-sm font-semibold text-indigo-600 hover:text-indigo-800"><span x-text="t('viewActivity')"></span> →</button></div></article></template></div>
    </section>
    <footer class="mt-16 border-t border-slate-200 pt-5 text-xs text-slate-400" x-text="t('footer')"></footer>
  </main>
  <div x-show="addOpen" @keydown.escape.window="addOpen=false" class="modal-bg fixed inset-0 z-20 flex items-center justify-center p-4" @click.self="addOpen=false"><div role="dialog" aria-modal="true" aria-labelledby="add-title" class="w-full max-w-md rounded-2xl bg-white p-6 shadow-xl"><div class="flex justify-between"><div><h2 id="add-title" class="text-xl font-bold" x-text="t('addSite')"></h2><p class="mt-1 text-sm text-slate-500" x-text="t('addDescription')"></p></div><button @click="addOpen=false" class="text-2xl text-slate-400" :aria-label="t('close')">×</button></div><form @submit.prevent="addSite()" class="mt-6 space-y-4"><label class="block text-sm font-semibold"><span x-text="t('clientName')"></span><input x-model="form.client_name" required maxlength="200" class="mt-2 w-full rounded-xl border border-slate-200 px-3 py-3 font-normal outline-none focus:border-indigo-500" :placeholder="t('clientPlaceholder')"></label><label class="block text-sm font-semibold"><span x-text="t('websiteUrl')"></span><input x-model="form.url" required maxlength="500" class="mt-2 w-full rounded-xl border border-slate-200 px-3 py-3 font-normal outline-none focus:border-indigo-500" placeholder="https://example.com"></label><p class="text-xs text-slate-400" x-text="t('scanHint')"></p><p x-show="modalError" class="text-sm text-rose-600" x-text="modalError"></p><div class="flex justify-end gap-2 pt-2"><button type="button" @click="addOpen=false" class="rounded-xl px-4 py-3 text-sm font-semibold text-slate-500" x-text="t('cancel')"></button><button :disabled="busy" class="rounded-xl bg-indigo-600 px-5 py-3 text-sm font-semibold text-white disabled:opacity-50" x-text="busy ? t('scanning') : t('startMonitoring')"></button></div></form></div></div>
  <div x-show="detailOpen" @keydown.escape.window="detailOpen=false" class="modal-bg fixed inset-0 z-20 flex items-center justify-center p-4" @click.self="detailOpen=false"><div role="dialog" aria-modal="true" aria-labelledby="detail-title" class="max-h-[90vh] w-full max-w-xl overflow-y-auto rounded-2xl bg-white p-6 shadow-xl"><div class="flex justify-between gap-3"><div><p class="text-xs font-bold uppercase tracking-wider text-indigo-600" x-text="t('clientActivity')"></p><h2 id="detail-title" class="mt-1 text-xl font-bold" x-text="selected?.client_name || t('loading')"></h2><p class="mt-1 break-all text-xs text-slate-400" x-text="selected?.url"></p></div><button @click="detailOpen=false" class="self-start text-2xl text-slate-400" :aria-label="t('close')">×</button></div><template x-if="selected"><div><div class="mt-6 grid grid-cols-2 gap-3 rounded-xl bg-slate-50 p-4 text-sm"><div><span class="block text-xs text-slate-400" x-text="t('sslExpiry')"></span><span x-text="date(selected.ssl_expires_at)"></span></div><div><span class="block text-xs text-slate-400" x-text="t('lastChecked')"></span><span x-text="dateTime(selected.checked_at)"></span></div><div><span class="block text-xs text-slate-400" x-text="t('domainExpiry')"></span><span x-text="date(selected.domain_expires_at)"></span></div><div><span class="block text-xs text-slate-400" x-text="t('structure')"></span><span x-text="selected.structure_changed ? t('changed') : (selected.structure_hash ? t('unchanged') : t('unknown'))"></span></div></div><button @click="rescan()" :disabled="busy" class="mt-4 rounded-lg border border-slate-200 px-3 py-2 text-xs font-semibold text-slate-600 disabled:opacity-50" x-text="busy ? t('scanning') : t('rescan')"></button><h3 class="mt-6 font-bold" x-text="t('history')"></h3><p x-show="!selected.logs.length" class="mt-3 text-sm text-slate-400" x-text="t('noNotes')"></p><ol class="mt-3 space-y-3"><template x-for="log in selected.logs" :key="log.id"><li class="border-l-2 border-indigo-200 pl-4"><time class="text-xs text-slate-400" x-text="dateTime(log.created_at)"></time><p class="mt-1 whitespace-pre-wrap break-words text-sm text-slate-700" x-text="log.body"></p></li></template></ol><form @submit.prevent="addLog()" class="mt-6"><label class="text-sm font-semibold" for="note" x-text="t('addNote')"></label><textarea id="note" x-model="note" required maxlength="10000" rows="3" class="mt-2 w-full rounded-xl border border-slate-200 p-3 text-sm outline-none focus:border-indigo-500" :placeholder="t('notePlaceholder')"></textarea><p x-show="modalError" class="mt-2 text-sm text-rose-600" x-text="modalError"></p><div class="mt-3 text-right"><button :disabled="busy" class="rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white disabled:opacity-50" x-text="t('saveNote')"></button></div></form></div></template><p x-show="modalError && !selected" class="mt-4 text-sm text-rose-600" x-text="modalError"></p></div></div>
<script>
const translations = {
 en:{workspace:'Agency workspace',language:'Language',switchLanguage:'Switch language',overview:'Overview',title:'Your sites, at a glance.',subtitle:'A clear picture of every client website you care for.',addSite:'Add New Client Site',yourSites:'Client websites',sitesSubtitle:'Monitor health and keep track of your work.',refresh:'Refresh',total:'Total Sites',totalHint:'Websites being monitored',expiring:'Expiring Domains',expiringHint:'Due within the next 30 days',down:'Down Sites',downHint:'Failed checks or HTTP errors',emptyTitle:'Your workspace is ready',emptyText:'Add your first client site to start monitoring.',addFirst:'+ Add your first site',loading:'Loading…',statusCode:'Status code',domainCountdown:'Domain countdown',unknown:'Unknown',noResponse:'No response time',viewActivity:'View activity',online:'Online',offline:'Down',days:'days',expired:'Expired',today:'Today',footer:'SitePulse · Your client care command center',addDescription:'Add a website and run its first check.',clientName:'Client name',clientPlaceholder:'e.g. Acme Studio',websiteUrl:'Website URL',scanHint:'The initial scan may take a little while.',cancel:'Cancel',startMonitoring:'Start monitoring',scanning:'Scanning…',close:'Close',clientActivity:'Client activity',sslExpiry:'SSL expiry',lastChecked:'Last checked',domainExpiry:'Domain expiry',structure:'Structure',changed:'Changed on last scan',unchanged:'No change detected',rescan:'Run a new scan',history:'Maintenance history',noNotes:'No maintenance notes yet.',addNote:'Add a maintenance note',notePlaceholder:'What did you work on?',saveNote:'Save note',requestFailed:'Something went wrong. Please try again.',duplicate:'This site is already monitored.',invalid:'Please enter a valid public website URL.',daysAgo:'days ago'},
 tr:{workspace:'Ajans çalışma alanı',language:'Dil',switchLanguage:'Dili değiştir',overview:'Genel bakış',title:'Siteleriniz bir bakışta.',subtitle:'İlgilendiğiniz tüm müşteri sitelerinin net bir görünümü.',addSite:'Yeni Müşteri Sitesi Ekle',yourSites:'Müşteri siteleri',sitesSubtitle:'Site durumunu izleyin ve çalışmalarınızı takip edin.',refresh:'Yenile',total:'Toplam Site',totalHint:'Takip edilen web siteleri',expiring:'Süresi Dolacak Alan Adları',expiringHint:'Önümüzdeki 30 gün içinde',down:'Erişilemeyen Siteler',downHint:'Başarısız kontroller veya HTTP hataları',emptyTitle:'Çalışma alanınız hazır',emptyText:'İzlemeye başlamak için ilk müşteri sitenizi ekleyin.',addFirst:'+ İlk sitenizi ekleyin',loading:'Yükleniyor…',statusCode:'Durum kodu',domainCountdown:'Alan adı süresi',unknown:'Bilinmiyor',noResponse:'Yanıt süresi yok',viewActivity:'Hareketleri gör',online:'Erişilebilir',offline:'Erişilemiyor',days:'gün',expired:'Süresi doldu',today:'Bugün',footer:'SitePulse · Müşteri bakım merkeziniz',addDescription:'Bir web sitesi ekleyin ve ilk kontrolü çalıştırın.',clientName:'Müşteri adı',clientPlaceholder:'Örn. Acme Studio',websiteUrl:'Web sitesi adresi',scanHint:'İlk tarama biraz zaman alabilir.',cancel:'İptal',startMonitoring:'İzlemeye başla',scanning:'Taranıyor…',close:'Kapat',clientActivity:'Müşteri hareketleri',sslExpiry:'SSL bitiş tarihi',lastChecked:'Son kontrol',domainExpiry:'Alan adı bitiş tarihi',structure:'Yapı',changed:'Son taramada değişti',unchanged:'Değişiklik algılanmadı',rescan:'Yeniden tara',history:'Bakım geçmişi',noNotes:'Henüz bakım notu yok.',addNote:'Bakım notu ekle',notePlaceholder:'Hangi çalışmayı yaptınız?',saveNote:'Notu kaydet',requestFailed:'Bir sorun oluştu. Lütfen tekrar deneyin.',duplicate:'Bu site zaten izleniyor.',invalid:'Geçerli ve herkese açık bir web sitesi adresi girin.',daysAgo:'gün önce'}
};
function dashboard(){return {lang:localStorage.getItem('sitepulse-language') === 'tr' ? 'tr' : 'en',data:{total_sites:0,expiring_domains:0,down_sites:0,sites:[]},loading:false,busy:false,error:'',modalError:'',addOpen:false,detailOpen:false,selected:null,note:'',form:{client_name:'',url:''},
 t(k){return translations[this.lang][k] || k},init(){this.load()},toggleLanguage(){this.lang=this.lang==='en'?'tr':'en';localStorage.setItem('sitepulse-language',this.lang)},metrics(){return [{label:this.t('total'),value:this.data.total_sites,hint:this.t('totalHint'),icon:'◈',color:'bg-indigo-50 text-indigo-600'},{label:this.t('expiring'),value:this.data.expiring_domains,hint:this.t('expiringHint'),icon:'◷',color:'bg-amber-50 text-amber-600'},{label:this.t('down'),value:this.data.down_sites,hint:this.t('downHint'),icon:'!',color:'bg-rose-50 text-rose-600'}]},
 async api(path,options={}){const r=await fetch(path,options);if(!r.ok){let e=new Error();e.status=r.status;throw e}return r.json()},message(e){return e.status===409?this.t('duplicate'):e.status===422?this.t('invalid'):this.t('requestFailed')},async load(){this.loading=true;this.error='';try{this.data=await this.api('/api/dashboard')}catch(e){this.error=this.message(e)}finally{this.loading=false}},openAdd(){this.form={client_name:'',url:''};this.modalError='';this.addOpen=true},async addSite(){if(this.busy)return;this.busy=true;this.modalError='';try{await this.api('/api/sites/onboarding',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(this.form)});this.addOpen=false;await this.load()}catch(e){this.modalError=this.message(e)}finally{this.busy=false}},async showSite(id){this.detailOpen=true;this.selected=null;this.note='';this.modalError='';try{this.selected=await this.api('/api/sites/'+id)}catch(e){this.modalError=this.message(e)}},async addLog(){if(this.busy||!this.note.trim())return;this.busy=true;this.modalError='';try{await this.api('/api/sites/'+this.selected.id+'/logs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body:this.note})});this.note='';this.selected=await this.api('/api/sites/'+this.selected.id)}catch(e){this.modalError=this.message(e)}finally{this.busy=false}},async rescan(){if(this.busy)return;this.busy=true;this.modalError='';try{await this.api('/api/sites/'+this.selected.id+'/scan',{method:'POST'});this.selected=await this.api('/api/sites/'+this.selected.id);await this.load()}catch(e){this.modalError=this.message(e)}finally{this.busy=false}},statusClass(s){return s.http_status!=null&&s.http_status<400?'bg-emerald-50 text-emerald-700':'bg-rose-50 text-rose-700'},statusText(s){return this.t(s.http_status!=null&&s.http_status<400?'online':'offline')},countdown(value){if(!value)return this.t('unknown');const n=Math.ceil((new Date(value)-Date.now())/86400000);return n<0?this.t('expired'):n===0?this.t('today'):n+' '+this.t('days')},date(value){return value?new Date(value).toLocaleDateString(this.lang==='tr'?'tr-TR':'en-US'):this.t('unknown')},dateTime(value){return value?new Date(value).toLocaleString(this.lang==='tr'?'tr-TR':'en-US'):this.t('unknown')}}}
</script>
</body></html>
