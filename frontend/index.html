<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SitePulse — Website care, in rhythm.</title>
  <link rel="icon" type="image/svg+xml" href="/assets/sitepulse-mark.svg"><link rel="icon" sizes="32x32" href="/assets/sitepulse-32.png"><link rel="apple-touch-icon" href="/assets/sitepulse-180.png"><meta name="theme-color" content="#193c34"><meta name="description" content="SitePulse — Website monitoring and maintenance, in rhythm.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>[x-cloak]{display:none!important}body{font-family:'DM Sans',ui-sans-serif,system-ui,sans-serif;background:#f4f4ef;color:#20282a}h1,h2,h3,.brand{font-family:'Space Grotesk',sans-serif}.modal-bg{background:rgba(15,23,42,.68);backdrop-filter:blur(5px)}.card-shadow{box-shadow:0 8px 28px rgba(30,40,32,.035)}.hero{background:radial-gradient(circle at 81% 25%,rgba(173,226,141,.17),transparent 31%),linear-gradient(115deg,#172a27,#213d37);position:relative;overflow:hidden}.hero:after{content:'';position:absolute;right:-55px;top:-120px;width:390px;height:390px;border:1px solid rgba(203,244,175,.15);border-radius:50%;box-shadow:0 0 0 42px rgba(203,244,175,.035),0 0 0 84px rgba(203,244,175,.03),0 0 0 126px rgba(203,244,175,.02);pointer-events:none}.eyebrow-dot{box-shadow:0 0 0 4px rgba(185,239,157,.13)}.bg-indigo-600{background-color:#b8ed98!important;color:#173028!important}.hover\:bg-indigo-700:hover{background-color:#a4df82!important}.text-indigo-600{color:#427b52!important}.bg-indigo-50{background-color:#edf7e9!important}.text-indigo-700{color:#31633f!important}.bg-indigo-100{background-color:#e4f4df!important} </style>
</head>
<body class="bg-slate-50 text-slate-900" x-data="dashboard()" x-init="init()" x-cloak :lang="lang">
  <header class="border-b border-slate-200 bg-white">
    <nav class="mx-auto flex max-w-7xl items-center justify-between px-5 py-5 sm:px-8" aria-label="Main navigation">
      <a href="/" class="flex items-center gap-3" aria-label="SitePulse"><img src="/assets/sitepulse-mark.svg" width="44" height="44" alt="" class="shrink-0"><div><div class="brand text-xl font-bold tracking-tight">SitePulse<span class="text-indigo-600">.</span></div><div class="text-[10px] font-semibold tracking-wide text-slate-500" x-text="t('tagline')"></div></div></a>
      <div class="flex items-center gap-3"><span class="hidden text-xs font-medium text-slate-400 sm:block" x-text="t('language')"></span><button type="button" @click="toggleLanguage()" class="rounded-lg border border-slate-200 px-3 py-2 text-xs font-bold text-slate-600 hover:bg-slate-50" :aria-label="t('switchLanguage')" x-text="lang === 'en' ? 'EN / TR' : 'TR / EN'"></button><div class="relative" @click.outside="alertsOpen=false" @keydown.escape.window="alertsOpen=false"><button @click="alertsOpen=!alertsOpen" :aria-label="t('notifications') + ': ' + alerts().length" :aria-expanded="alertsOpen" class="relative grid h-10 w-10 place-items-center rounded-xl border border-slate-200 bg-white hover:bg-slate-50"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span x-show="alerts().length" class="absolute -right-1 -top-1 rounded-full bg-rose-600 px-1.5 text-[10px] font-bold text-white" x-text="alerts().length"></span></button><section x-show="alertsOpen" x-cloak class="absolute right-0 top-12 z-30 max-h-[70vh] w-[min(340px,90vw)] overflow-y-auto rounded-2xl border border-slate-200 bg-white p-4 shadow-xl" :aria-label="t('notifications')"><h2 class="mb-3 font-bold" x-text="t('notifications')"></h2><p x-show="!alerts().length" class="rounded-xl bg-emerald-50 p-4 text-sm text-emerald-800"><span aria-hidden="true">💚 </span><span x-text="t('allClear')"></span></p><template x-for="alert in alerts()" :key="alert.key"><button @click="alertsOpen=false;showSite(alert.site.id)" class="my-1 flex w-full gap-3 rounded-xl p-3 text-left hover:bg-slate-50"><span aria-hidden="true" x-text="alert.icon"></span><span><strong class="block text-sm" x-text="alert.site.client_name"></strong><span class="text-xs text-slate-500" x-text="t(alert.type)"></span></span></button></template><p class="mt-3 text-[10px] text-slate-400" x-text="t('alertHint')"></p></section></div></div>
    </nav>
  </header>
  <main class="mx-auto max-w-7xl px-5 pb-16 pt-10 sm:px-8 sm:pt-14">
    <div class="hero rounded-[26px] px-6 py-8 text-white sm:px-9 sm:py-10"><div class="relative z-10 flex flex-col justify-between gap-7 sm:flex-row sm:items-end"><div><p class="mb-5 flex items-center gap-2 text-[11px] font-bold uppercase tracking-[.2em] text-emerald-200"><span class="eyebrow-dot h-2 w-2 rounded-full bg-lime-300"></span><span x-text="t('overview')"></span> / SITEPULSE</p><h1 class="max-w-xl text-3xl font-bold tracking-tight sm:text-4xl" x-text="t('title')"></h1><p class="mt-3 max-w-lg text-sm leading-6 text-emerald-100/70" x-text="t('subtitle')"></p></div><button @click="openAdd()" class="inline-flex shrink-0 items-center justify-center gap-2 rounded-xl bg-indigo-600 px-5 py-3 text-sm font-bold shadow-sm hover:bg-indigo-700"><span class="text-lg leading-none">+</span><span x-text="t('addSite')"></span></button></div></div>
    <div x-show="error" role="alert" class="mt-6 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700" x-text="error"></div>
    <section class="mt-9 grid gap-4 sm:grid-cols-3" :aria-label="t('overview')">
      <template x-for="metric in metrics()" :key="metric.label"><div class="card-shadow rounded-2xl border border-slate-200 bg-white p-5"><div class="flex items-center justify-between"><span class="text-sm font-medium text-slate-500" x-text="metric.label"></span><span class="grid h-9 w-9 place-items-center rounded-xl text-lg" :class="metric.color" x-text="metric.icon"></span></div><div class="mt-4 text-3xl font-bold tracking-tight" x-text="metric.value"></div><div class="mt-1 text-xs text-slate-400" x-text="metric.hint"></div></div></template>
    </section>
    <section class="mt-12"><div class="mb-5 flex items-center justify-between gap-4"><div><h2 class="text-lg font-bold" x-text="t('yourSites')"></h2><p class="mt-1 text-sm text-slate-500" x-text="t('sitesSubtitle')"></p></div><button @click="load()" :disabled="loading" class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-50 disabled:opacity-50" x-text="t('refresh')"></button></div>
      <div x-show="loading && !data.sites.length" class="py-12 text-center text-sm text-slate-500" x-text="t('loading')"></div>
      <div x-show="!loading && !data.sites.length" class="rounded-2xl border border-dashed border-slate-300 bg-white py-16 text-center"><img src="/assets/sitepulse-mark.svg" alt="" width="56" height="56" class="mx-auto mb-4 opacity-80"><h3 class="mt-3 font-semibold" x-text="t('emptyTitle')"></h3><p class="mt-1 text-sm text-slate-500" x-text="t('emptyText')"></p><button @click="openAdd()" class="mt-5 text-sm font-semibold text-indigo-600" x-text="t('addFirst')"></button></div>
      <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3"><template x-for="site in data.sites" :key="site.id"><article class="card-shadow rounded-2xl border border-slate-200 bg-white p-5"><div class="flex items-start justify-between gap-3"><div class="flex min-w-0 items-center gap-3"><div class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-indigo-50 text-sm font-bold text-indigo-600" x-text="site.client_name.slice(0,2).toUpperCase()"></div><div class="min-w-0"><h3 class="truncate font-bold" x-text="site.client_name"></h3><a :href="site.url" target="_blank" rel="noopener noreferrer" class="block truncate text-xs text-slate-400 hover:text-indigo-600" x-text="site.url"></a></div></div><span class="shrink-0 rounded-full px-2.5 py-1 text-[11px] font-semibold" :class="statusClass(site)" x-text="statusText(site)"></span></div><div class="my-5 grid grid-cols-2 gap-3 border-y border-slate-100 py-4"><div><p class="text-xs text-slate-400" x-text="t('statusCode')"></p><p class="mt-1 text-sm font-semibold" x-text="site.http_status ?? t('unknown')"></p></div><div><p class="text-xs text-slate-400" x-text="t('domainCountdown')"></p><p class="mt-1 text-sm font-semibold" x-text="countdown(site.domain_expires_at)"></p></div></div><div class="flex items-center justify-between gap-2"><span class="text-xs text-slate-400" x-text="site.response_ms == null ? t('noResponse') : site.response_ms + ' ms'"></span><button @click="showSite(site.id)" class="text-sm font-semibold text-indigo-600 hover:text-indigo-800"><span x-text="t('viewActivity')"></span> →</button></div></article></template></div>
    </section>
    <footer class="mt-16 border-t border-slate-200 pt-5 text-xs text-slate-400" x-text="t('footer')"></footer>
  </main>
  <div x-show="addOpen" @keydown.escape.window="addOpen=false" class="modal-bg fixed inset-0 z-20 flex items-center justify-center p-4" @click.self="addOpen=false"><div role="dialog" aria-modal="true" aria-labelledby="add-title" class="w-full max-w-md rounded-2xl bg-white p-6 shadow-xl"><div class="flex justify-between"><div><h2 id="add-title" class="text-xl font-bold" x-text="t('addSite')"></h2><p class="mt-1 text-sm text-slate-500" x-text="t('addDescription')"></p></div><button @click="addOpen=false" class="text-2xl text-slate-400" :aria-label="t('close')">×</button></div><form @submit.prevent="addSite()" class="mt-6 space-y-4"><label class="block text-sm font-semibold"><span x-text="t('clientName')"></span><input x-model="form.client_name" required maxlength="200" class="mt-2 w-full rounded-xl border border-slate-200 px-3 py-3 font-normal outline-none focus:border-indigo-500" :placeholder="t('clientPlaceholder')"></label><label class="block text-sm font-semibold"><span x-text="t('websiteUrl')"></span><input x-model="form.url" required maxlength="500" class="mt-2 w-full rounded-xl border border-slate-200 px-3 py-3 font-normal outline-none focus:border-indigo-500" placeholder="https://example.com"></label><p class="text-xs text-slate-400" x-text="t('scanHint')"></p><p x-show="modalError" class="text-sm text-rose-600" x-text="modalError"></p><div class="flex justify-end gap-2 pt-2"><button type="button" @click="addOpen=false" class="rounded-xl px-4 py-3 text-sm font-semibold text-slate-500" x-text="t('cancel')"></button><button :disabled="busy" class="rounded-xl bg-indigo-600 px-5 py-3 text-sm font-semibold text-white disabled:opacity-50" x-text="busy ? t('scanning') : t('startMonitoring')"></button></div></form></div></div>
  <div x-show="detailOpen" @keydown.escape.window="detailOpen=false" class="modal-bg fixed inset-0 z-20 flex items-center justify-center p-4" @click.self="detailOpen=false"><div role="dialog" aria-modal="true" aria-labelledby="detail-title" class="max-h-[90vh] w-full max-w-3xl overflow-y-auto rounded-2xl bg-white p-6 shadow-xl"><div class="flex justify-between gap-3"><div><p class="text-xs font-bold uppercase tracking-wider text-indigo-600" x-text="t('clientActivity')"></p><h2 id="detail-title" class="mt-1 text-xl font-bold" x-text="selected?.client_name || t('loading')"></h2><p class="mt-1 break-all text-xs text-slate-400" x-text="selected?.url"></p></div><button @click="detailOpen=false" class="self-start text-2xl text-slate-400" :aria-label="t('close')">×</button></div><template x-if="selected"><div><div class="mt-6 grid grid-cols-2 gap-3 rounded-xl bg-slate-50 p-4 text-sm"><div><span class="block text-xs text-slate-400" x-text="t('sslExpiry')"></span><span x-text="date(selected.ssl_expires_at)"></span><small class="block text-slate-500" x-text="countdown(selected.ssl_expires_at)"></small></div><div><span class="block text-xs text-slate-400" x-text="t('lastChecked')"></span><span x-text="dateTime(selected.checked_at)"></span></div><div><span class="block text-xs text-slate-400" x-text="t('domainExpiry')"></span><span x-text="date(selected.domain_expires_at)"></span><small class="block text-slate-500" x-text="countdown(selected.domain_expires_at)"></small></div><div><span class="block text-xs text-slate-400" x-text="t('structure')"></span><span x-text="selected.structure_changed ? t('changed') : (selected.structure_hash ? t('unchanged') : t('unknown'))"></span></div></div><section class="mt-6 rounded-2xl border border-emerald-100 bg-[#f4f7f1] p-4"><div class="flex items-center gap-3"><img src="/assets/sitepulse-mark.svg" alt="" width="32" height="32"><div><h3 class="font-bold" x-text="t('radar')"></h3><p class="text-xs text-slate-500" x-text="t('radarScope')"></p></div></div><p x-show="!selected.insights" class="mt-4 text-sm text-slate-500" x-text="t('radarEmpty')"></p><template x-if="selected.insights"><div><div class="mt-4 grid gap-4 sm:grid-cols-2"><div class="rounded-xl bg-white p-4"><h4 class="text-sm font-bold" x-text="t('stack')"></h4><p x-show="!selected.insights.technology.length" class="mt-2 text-xs text-slate-500" x-text="t('unknown')"></p><template x-for="(tech,i) in selected.insights.technology" :key="i"><p class="mt-2 text-sm"><strong x-text="tech.name"></strong><small class="block text-slate-400" x-text="tech.evidence"></small></p></template><p class="mt-3 text-[10px] text-slate-400" x-text="t('stackHint')"></p></div><div class="rounded-xl bg-white p-4"><h4 class="text-sm font-bold" x-text="t('securitySignals')"></h4><template x-for="(present,name) in selected.insights.security" :key="name"><p class="mt-2 flex justify-between gap-2 text-xs"><span class="break-all" x-text="name"></span><span :class="present?'text-emerald-700':'text-amber-700'" x-text="present?t('present'):t('notObserved')"></span></p></template></div><div class="rounded-xl bg-white p-4"><h4 class="text-sm font-bold" x-text="t('dependencies')"></h4><p class="mt-1 text-[10px] text-slate-400" x-text="t('dependencyHint')"></p><p x-show="!selected.insights.dependencies.length" class="mt-2 text-xs text-slate-500" x-text="t('noneObserved')"></p><div class="max-h-32 overflow-y-auto"><template x-for="dep in selected.insights.dependencies" :key="dep.host"><p class="mt-2 break-all text-xs"><span x-text="dep.host"></span><small class="ml-2 text-slate-400" x-text="dep.types.join(', ')"></small></p></template></div></div><div class="rounded-xl bg-white p-4"><h4 class="text-sm font-bold" x-text="t('searchReadiness')"></h4><p class="mt-2 break-words text-sm" x-text="selected.insights.seo.title || t('unknown')"></p><p class="mt-2 text-xs text-slate-500"><span x-text="t('imagesWithoutAlt')"></span>: <span x-text="selected.insights.seo.missing_alt"></span> / <span x-text="selected.insights.seo.image_count"></span></p><p class="mt-2 text-xs text-slate-500">H1: <span x-text="selected.insights.seo.h1_count"></span> · <span x-text="t('language')"></span>: <span x-text="selected.insights.seo.language || t('unknown')"></span></p><p class="mt-2 break-all text-xs text-slate-500">Canonical: <span x-text="selected.insights.seo.canonical || t('notObserved')"></span></p></div></div><template x-if="selected.insights.changes"><div class="mt-4 rounded-xl bg-white p-4"><h4 class="text-sm font-bold" x-text="t('changeReceipt')"></h4><p class="mt-2 text-xs text-slate-500" x-text="t('changeHint')"></p><p class="mt-2 text-sm"><span x-text="t('newDependencies')"></span>: <span x-text="selected.insights.changes.added_dependencies.join(', ') || '—'"></span></p><p class="mt-1 text-sm"><span x-text="t('removedDependencies')"></span>: <span x-text="selected.insights.changes.removed_dependencies.join(', ') || '—'"></span></p><p class="mt-1 text-sm"><span x-text="t('lostHeaders')"></span>: <span x-text="selected.insights.changes.lost_headers.join(', ') || '—'"></span></p><p class="mt-1 text-sm" x-show="selected.insights.changes.title_changed" x-text="t('titleChanged')"></p></div></template><h4 class="mt-5 text-sm font-bold" x-text="t('carePlan')"></h4><p x-show="!selected.insights.tasks.length" class="mt-3 text-sm text-slate-500" x-text="t('noTasks')"></p><template x-for="task in selected.insights.tasks" :key="task.code"><div class="mt-3 rounded-xl border border-slate-100 bg-white p-4"><div class="flex justify-between gap-3"><strong class="text-sm" x-text="t('task_'+task.code)"></strong><span class="text-[10px] font-bold uppercase" :class="task.priority==='high'?'text-rose-600':'text-amber-700'" x-text="t(task.priority)"></span></div><p class="mt-2 text-xs text-slate-500" x-text="t('fix_'+task.code)"></p><p class="mt-2 break-words font-mono text-[11px] text-slate-400"><span x-text="t('evidence')"></span>: <span x-text="task.evidence"></span></p><button type="button" @click="note=t('task_'+task.code)+': '+t('fix_'+task.code)" class="mt-3 text-xs font-bold text-indigo-600" x-text="t('draftNote')"></button></div></template></div></template></section><button @click="rescan()" :disabled="busy" class="mt-4 rounded-lg border border-slate-200 px-3 py-2 text-xs font-semibold text-slate-600 disabled:opacity-50" x-text="busy ? t('scanning') : t('rescan')"></button><section class="mt-6 space-y-4"><div class="flex flex-wrap items-center justify-between gap-3 rounded-xl bg-[#193c34] p-4 text-white"><div><h3 class="font-bold" x-text="t('healthScore')"></h3><p class="mt-1 text-xs text-emerald-100/70" x-text="t('scoreHint')"></p></div><strong class="text-3xl" x-text="selected.insights?.score == null ? '—' : selected.insights.score+'/100'"></strong></div><a :href="'/api/sites/'+selected.id+'/report.pdf?lang='+lang" target="_blank" rel="noopener" class="inline-block rounded-xl bg-indigo-600 px-4 py-3 text-sm font-bold"><span aria-hidden="true">📄 </span><span x-text="t('downloadReport')"></span></a><details class="rounded-xl border border-slate-200 p-4"><summary class="cursor-pointer font-bold" x-text="t('timelineTitle')"></summary><p class="mt-2 text-xs text-slate-500" x-text="t('timelineHint')"></p><button @click="loadTimeline()" class="mt-3 text-xs font-bold text-indigo-600" x-text="t('refresh')"></button><p x-show="!timelineRows.length" class="mt-3 text-sm text-slate-500" x-text="t('noSnapshots')"></p><template x-for="entry in timelineRows" :key="entry.id"><div class="mt-4"><div class="flex flex-wrap justify-between gap-2 text-xs"><time x-text="dateTime(entry.captured_at)"></time><span><b class="text-emerald-700" x-text="'+'+entry.added"></b> / <b class="text-rose-600" x-text="'-'+entry.removed"></b></span></div><p x-show="!entry.previous_at" class="mt-2 text-xs text-slate-400" x-text="t('baseline')"></p><div class="mt-2 max-h-48 overflow-auto rounded-lg bg-slate-50 font-mono text-[11px]"><template x-for="(line,i) in entry.diff" :key="i"><p class="whitespace-pre-wrap break-all px-3 py-1" :class="line.kind==='+'?'bg-emerald-50 text-emerald-800':line.kind==='-'?'bg-rose-50 text-rose-800':'text-slate-400'" x-text="line.kind+' '+line.text"></p></template></div></div></template></details><details class="rounded-xl border border-slate-200 p-4"><summary class="cursor-pointer font-bold" x-text="t('orphanTitle')"></summary><p class="mt-2 text-xs text-slate-500" x-text="t('crawlHint')"></p><button @click="runCrawl()" :disabled="featureBusy" class="mt-3 rounded-lg border px-3 py-2 text-xs font-bold disabled:opacity-50" x-text="featureBusy?t('scanning'):t('crawlStart')"></button><template x-if="crawlData"><div><p x-show="crawlData.reason" class="mt-3 text-sm text-amber-700" x-text="t('robotsUnavailable')"></p><template x-for="page in crawlData.pages" :key="page.url"><div class="mt-3 rounded-lg bg-slate-50 p-3"><p class="break-all text-xs font-bold" x-text="page.url"></p><p class="mt-1 text-xs text-slate-500"><span x-text="page.status ?? t('unknown')"></span> · <span x-text="page.words ?? '—'"></span> <span x-text="t('words')"></span></p><p x-show="page.sparse" class="mt-2 text-xs text-amber-700" x-text="t('sparseHint')"></p><template x-for="task in page.tasks" :key="task.code"><p class="mt-2 text-xs text-rose-700" x-text="t('task_'+task.code)"></p></template><p x-show="page.plugins.length" class="mt-2 break-all text-xs text-slate-500"><span x-text="t('pluginTraces')"></span>: <span x-text="page.plugins.join(', ')"></span></p></div></template></div></template><p class="mt-3 text-[11px] text-slate-400" x-text="t('pluginHint')"></p></details><details class="rounded-xl border border-slate-200 p-4"><summary class="cursor-pointer font-bold">🛡️ Payment Shield</summary><p class="mt-2 text-xs text-slate-500" x-text="t('shieldHint')"></p><p class="mt-2 text-sm"><span x-text="t('receiver')"></span>: <strong x-text="selected.shield_configured?t('paired'):t('unpaired')"></strong> · <span x-text="selected.shield_st  async api(path,options={}){const r=await fetch(path,options);if(!r.ok){let e=new Error();e.status=r.status;throw e}return r.json()},message(e){return e.status===409?this.t('duplicate'):e.status===422?this.t('invalid'):this.t('requestFailed')},async load(){this.loading=true;this.error='';try{this.data=await this.api('/api/dashboard')}catch(e){this.error=this.message(e)}finally{this.loading=false}},openAdd(){this.form={client_name:'',url:''};this.modalError='';this.addOpen=true},async addSite(){if(this.busy)return;this.busy=true;this.modalError='';try{await this.api('/api/sites/onboarding',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(this.form)});this.addOpen=false;this.notify('siteAdded');await this.load()}catch(e){this.modalError=this.message(e)}finally{this.busy=false}},async showSite(id){this.inventory=null;this.timelineRows=[];this.crawlData=null;this.featureError='';this.shieldUrl='';this.shieldSecret='';this.shieldConfirm='';this.detailOpen=true;this.selected=null;this.note='';this.modalError='';try{this.selected=await this.api('/api/sites/'+id);await this.loadTimeline()}catch(e){this.modalError=this.message(e)}},async addLog(){if(this.busy||!this.note.trim())return;this.busy=true;this.modalError='';try{await this.api('/api/sites/'+this.selected.id+'/logs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body:this.note})});this.note='';this.notify('noteSaved');this.selected=await this.api('/api/sites/'+this.selected.id)}catch(e){this.modalError=this.message(e)}finally{this.busy=false}},async rescan(){if(this.busy)return;this.busy=true;this.modalError='';try{await this.api('/api/sites/'+this.selected.id+'/scan',{method:'POST'});this.selected=await this.api('/api/sites/'+this.selected.id);this.notify('scanDone');await this.loadTimeline();await this.load()}catch(e){this.modalError=this.message(e)}finally{this.busy=false}},statusClass(s){return s.http_status!=null&&s.http_status<400?'bg-emerald-50 te
