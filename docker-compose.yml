services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sitepulse
      POSTGRES_USER: sitepulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sitepulse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitepulse -d sitepulse"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  api:
    build: .
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sitepulse}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
